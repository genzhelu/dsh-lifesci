# dsh-lifesci bundle patch: one host row that registers the lifesci.* agent tools.
#
# This file is the `dsh.bundle.patch` layer of the package. When the plugin is
# installed into a profile through the official CLI
#
#   dsh plugin --profile <profile> add <path-or-package>
#
# the profile reconciles `dsh.profile.bundles` against installed packages and
# appends this bundle; profile boot then merges THIS patch (one `insert`) like
# any other Cordis composition layer. No profile file edits are needed.
#
# The row config is empty by default. Operators may override it in the profile's
# own cordis.patch.yml with e.g.:
#
#   - override:
#       - id: lifesci
#         config:
#           pythonPath: /opt/lifesci/.venv/bin/python
#           offline: true
- insert:
    - id: lifesci
      name: '@genzhelu/dsh-lifesci'
      config: {}
