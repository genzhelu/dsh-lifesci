<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-labelledby="title desc">
  <title id="title">LifeSci Research</title>
  <desc id="desc">A DNA double helix crossed by bond rungs, with data points plotted along it.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b2b3c"/>
      <stop offset="1" stop-color="#124e6b"/>
    </linearGradient>
    <linearGradient id="strandA" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7ef0d2"/>
      <stop offset="1" stop-color="#2bb3a3"/>
    </linearGradient>
    <linearGradient id="strandB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8ec8ff"/>
      <stop offset="1" stop-color="#3c7cf0"/>
    </linearGradient>
    <linearGradient id="dot" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd166"/>
      <stop offset="1" stop-color="#f79c42"/>
    </linearGradient>
  </defs>

  <rect x="1" y="1" width="62" height="62" rx="14" fill="url(#bg)" stroke="#1c6b86" stroke-width="1.5"/>

  <!-- two antiparallel strands of the helix -->
  <path d="M20 8 C34 16 34 24 20 32 C34 40 34 48 20 56" fill="none"
        stroke="url(#strandA)" stroke-width="3.6" stroke-linecap="round"/>
  <path d="M44 8 C30 16 30 24 44 32 C30 40 30 48 44 56" fill="none"
        stroke="url(#strandB)" stroke-width="3.6" stroke-linecap="round"/>

  <!-- base-pair rungs -->
  <g stroke="#bfe9f2" stroke-width="1.9" stroke-linecap="round" opacity="0.85">
    <line x1="23.5" y1="12.6" x2="40.5" y2="12.6"/>
    <line x1="30.2" y1="19.4" x2="33.8" y2="19.4"/>
    <line x1="23.5" y1="25.8" x2="40.5" y2="25.8"/>
    <line x1="27.6" y1="32" x2="36.4" y2="32"/>
    <line x1="23.5" y1="38.2" x2="40.5" y2="38.2"/>
    <line x1="30.2" y1="44.6" x2="33.8" y2="44.6"/>
    <line x1="23.5" y1="51.4" x2="40.5" y2="51.4"/>
  </g>

  <!-- data points: a measured series along the helix -->
  <g fill="url(#dot)" stroke="#3a2600" stroke-width="0.8">
    <circle cx="23.5" cy="12.6" r="2.6"/>
    <circle cx="40.5" cy="25.8" r="2.6"/>
    <circle cx="27.6" cy="32" r="2.6"/>
    <circle cx="40.5" cy="38.2" r="2.6"/>
    <circle cx="23.5" cy="51.4" r="2.6"/>
  </g>

  <!-- plotting spine + trend line for the data series -->
  <path d="M18.5 9.5 L18.5 54.5 L46 54.5" fill="none" stroke="#9fdfe8" stroke-width="1.2"
        stroke-linecap="round" stroke-linejoin="round" opacity="0.55"/>
  <path d="M22 48.5 L29 40.5 L36 34.5 L43 27.5" fill="none" stroke="#ffd166" stroke-width="1.6"
        stroke-linecap="round" stroke-dasharray="2.4 2.2" opacity="0.9"/>
</svg>
